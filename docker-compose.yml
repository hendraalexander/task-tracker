services:
  db:
    image: postgres:16-alpine
    container_name: atracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: atracker
      POSTGRES_PASSWORD: atracker
      POSTGRES_DB: atracker
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - atracker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atracker -d atracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  atracker_pgdata:
