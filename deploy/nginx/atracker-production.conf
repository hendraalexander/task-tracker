# A Tracker — production
# /etc/nginx/sites-available/atracker-production
#   sudo ln -s /etc/nginx/sites-available/atracker-production /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app.atracker.app --redirect
#
# Aktifkan HSTS hanya setelah HTTPS stabil minimal beberapa hari.

server {
    listen 80;
    listen [::]:80;
    server_name app.atracker.app;

    client_max_body_size 30m;

    location /uploads/ {
        alias /srv/atracker/data/uploads/;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;

        location ~* \.(php|phtml|phar|sh|bash|py|pl|rb|cgi|html?)$ {
            deny all;
        }
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering on;
    }

    # Health check ringan untuk monitoring eksternal.
    location = /healthz {
        proxy_pass http://127.0.0.1:3000/api/health;
        access_log off;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/atracker-production.access.log;
    error_log  /var/log/nginx/atracker-production.error.log;
}
