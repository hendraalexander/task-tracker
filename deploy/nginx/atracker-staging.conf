# A Tracker — staging
# /etc/nginx/sites-available/atracker-staging
# Setelah DNS staging.atracker.app mengarah ke server ini:
#   sudo ln -s /etc/nginx/sites-available/atracker-staging /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d staging.atracker.app --redirect
#
# Ganti domain dan path bila perlu. Certbot akan menambahkan blok 443.

server {
    listen 80;
    listen [::]:80;
    server_name staging.atracker.app;

    # Attachment 25 MB + overhead multipart.
    client_max_body_size 30m;

    # File upload disajikan langsung oleh Nginx, bukan Node.
    # Path harus sama dengan bind mount compose: ./data/uploads
    location /uploads/ {
        alias /opt/atracker-staging/data/uploads/;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;

        # Jangan pernah eksekusi file yang diunggah.
        location ~* \.(php|phtml|phar|sh|bash|py|pl|rb|cgi|html?)$ {
            deny all;
        }
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering on;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    access_log /var/log/nginx/atracker-staging.access.log;
    error_log  /var/log/nginx/atracker-staging.error.log;
}
